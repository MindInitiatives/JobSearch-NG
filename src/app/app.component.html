<app-header></app-header>
<div class="container mx-auto mb-5">
  <app-search-bar></app-search-bar>
  @if (isLoading()) {
  <app-spinner></app-spinner>
  }
  @if (data() && data().length > 0) {
  @for (job of data(); track $index ;){
  <app-job-card (jobSelected)="selectJob(job)" [job]="job"></app-job-card>
  }
  }
  @if (error()) {
  <div class="flex flex-wrap flex-col md:flex-row items-center justify-items-center">
    <div class='flex flex-col justify-center items-center flex-1 h-[50vh]'>
      <div class="w-20 h-20 rounded-full inline-flex items-center justify-center text-red-400">
        <svg width="95" height="94" viewBox="0 0 95 94" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M8.33398 46.9974C8.33398 68.6135 25.8806 86.1641 47.5006 86.1641C69.1598 86.1641 86.6673 68.6135 86.6673 46.9974C86.6673 25.3735 69.1598 7.83073 47.5006 7.83073C25.8806 7.83073 8.33398 25.3735 8.33398 46.9974ZM44.054 61.8416C44.054 63.7176 45.6206 65.2882 47.5006 65.2882C49.3806 65.2882 50.9081 63.7176 50.9081 61.8416V44.5299C50.9081 42.646 49.3806 41.1224 47.5006 41.1224C45.6206 41.1224 44.054 42.646 44.054 44.5299V61.8416ZM47.5398 28.6635C45.6207 28.6635 44.0932 30.2301 44.0932 32.1101C44.0932 33.9901 45.6207 35.5176 47.5007 35.5176C49.4198 35.5176 50.9473 33.9901 50.9473 32.1101C50.9473 30.2301 49.4198 28.6635 47.5398 28.6635Z"
            fill="currentColor" />
        </svg>
      </div>
      <div class="flex flex-col items-center text-center justify-center w-60">
        <h2 class="font-medium title-font mt-4 text-gray-900 text-base">Oops! something went wrong</h2>
        <div class="w-12 h-1 bg-red-500 rounded mt-2 mb-4"></div>
        <p class="text-sm">{{error()?.message}}</p>
      </div>
    </div>
  </div>
  }
</div>
