
<div class="border border-[#e8e8e8] hover:shadow-lg hover:border-l-[6px] hover:border-sky-500 transition-all duration-[.3s] p-4 w-full">
    <div class="grid md:grid-cols-3 grid-cols-1 gap-4 w-full items-center">
      <div class="col-start-1 row-start-1 flex items-center gap-3 pr-6">
        <div class="h-10 w-10 sm:mr-2 inline-flex items-center justify-center rounded-full bg-sky-100 flex-shrink-0">
          <img [src]="
            checkImageURL(job.employer_logo)
            ? job.employer_logo
            : 'https://t4.ftcdn.net/jpg/05/05/61/73/360_F_505617309_NN1CW7diNmGXJfMicpY9eXHKV4sqzO5H.jpg'" alt="employer logo" class="size-[70%] rounded-full shrink-0" />
        </div>
        <div class="flex justify-center flex-col">
          <h6 class="font-semibold">{{job.employer_name}}</h6>
        </div>
      </div>
      <div class="flex items-center justify-start">
          <span
            class="p-2 w-fit m-2 text-sm rounded-md transition-all duration-[.3s] cursor-pointer bg-secondary text-white"
          >
            {{job.job_title}}
          </span>
      </div>
      <div class="flex items-end flex-col">
        <p>{{job.job_posted_at}} | {{job.job_employment_type}}</p>
        <div class="mt-4">
          <button
            (click)="jobSelected.emit(job)"
            class="rounded-full border border-gray-500 py-2 px-4 text-sm text-gray-500 data-[hover]:border-sky-600 data-[hover]:text-sky-600 data-[active]:border-gray-700"
          >
            view
          </button>
        </div>
      </div>
    </div>
  </div>
